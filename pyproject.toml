[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-risk-manager"
version = "0.1.0"
description = "Kairos Layer 5 — deterministic risk validation and circuit breaker."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.2.0,<0.3.0",
    "kairos-persistence>=0.1,<0.2",
    "redis>=6.4,<9",
    "structlog>=24.1,<27",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3"
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[project.scripts]
kairos-risk-manager = "kairos_risk.service:main"

[tool.hatch.build.targets.wheel]
packages = ["kairos_risk"]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "c2b9ba192521f9843b245e1eae8a501d408a6bfa" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "5709e7b8a1f9a11bc1727c2c23e39cdcd683f909" }

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
